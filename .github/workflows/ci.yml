name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      # Version de pnpm lue dans le champ « packageManager » de package.json
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # --ignore-scripts : aucun script d'installation des dépendances n'est exécuté (chaîne d'approvisionnement)
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm lint
      # Les types PageProps / LayoutProps sont générés par Next.js avant la vérification
      - run: pnpm exec next typegen && pnpm typecheck
      - run: pnpm build
